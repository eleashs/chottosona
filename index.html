function sendMsg(){const n=$('#mn').value.trim(),ph=$('#mp').value.trim(),m=$('#mm').value.trim(),en=LANG=='en';if(!n||!m)return toast(en?'Enter name and message':'নাম ও বার্তা দিন');const x={n,ph,m,ts:Date.now(),dt:new Date().toLocaleDateString()};msgs.unshift(x);W('bm',msgs);if(db)db.collection('messages').add(x).catch(()=>{});toast(en?'Message sent ✓':'বার্তা পাঠানো হয়েছে ✓');contact()}
function about(){const en=LANG=='en';$('#app').innerHTML=`<h2>${en?'About us':'আমাদের সম্পর্কে'}</h2><div style="max-width:700px;line-height:1.8"><p>${en?'Chotto Shona is an online shop for baby products in Bangladesh. We deliver diapers, baby food and formula, skincare, feeding items, toys and clothes to your door.':'ছোট্ট সোনা বাংলাদেশের শিশুদের পণ্যের অনলাইন শপ। আমরা ডায়াপার, বেবি ফুড ও ফর্মুলা, স্কিনকেয়ার, ফিডিং আইটেম, খেলনা ও জামাকাপড় আপনার দরজায় পৌঁছে দিই।'}</p><p>${en?'Our promise: original products, fast delivery all over Bangladesh, cash on delivery, bKash and Nagad payment, and a 7-day return if you do not like the product.':'আমাদের অঙ্গীকার: আসল পণ্য, সারা বাংলাদেশে দ্রুত ডেলিভারি, ক্যাশ অন ডেলিভারি, bKash ও Nagad পেমেন্ট এবং পছন্দ না হলে ৭ দিনে রিটার্ন।'}</p><button class="btn" onclick="go('contact')">${en?'Contact us':'যোগাযোগ করুন'}</button></div>`}
function contact(){const en=LANG=='en',x=(a,b)=>en?b:a;$('#app').innerHTML=`<h2>${x('যোগাযোগ','Contact')}</h2><div style="max-width:460px"><p>📞 <a href="tel:01719961987">01719961987</a><br>💬 <a href="https://wa.me/8801719961987" target="_blank" rel="noopener">WhatsApp</a></p><input id="mn" placeholder="${x('আপনার নাম','Your name')}"><input id="mp" placeholder="${x('মোবাইল নম্বর','Mobile number')}"><textarea id="mm" rows="4" placeholder="${x('আপনার বার্তা','Your message')}"></textarea><button class="btn" onclick="sendMsg()">${x('পাঠান','Send')}</button></div>`}
function policy(){const en=LANG=='en',P1=en?['If you do not like a product, you may request a return within 7 days of receiving it.','The product must be unused, undamaged and in its original packaging.','To return, call or message 01719961987 with your order number.','For health and safety, opened baby food, formula, wipes and skincare products cannot be returned.','If you receive a wrong or damaged product, we will replace it at our cost. For a return because you did not like it, the delivery charge is paid by the customer.','After we receive and check the product, the replacement or refund is processed within 3-5 working days.']:['পণ্য হাতে পাওয়ার ৭ দিনের মধ্যে পছন্দ না হলে রিটার্নের অনুরোধ করা যাবে।','পণ্য অব্যবহৃত, অক্ষত ও আসল প্যাকেটে থাকতে হবে।','রিটার্নের জন্য ০১৭১৯৯৬১৯৮৭ নম্বরে কল বা মেসেজ করে অর্ডার নম্বর জানান।','স্বাস্থ্য ও নিরাপত্তার কারণে সিল খোলা বেবি ফুড, ফর্মুলা, ওয়াইপস ও স্কিনকেয়ার পণ্য রিটার্ন নেওয়া হয় না।','ভুল বা ক্ষতিগ্রস্ত পণ্য এলে আমাদের খরচে বদলে দেওয়া হবে। পছন্দ না হওয়ায় রিটার্ন করলে ডেলিভারি চার্জ কাস্টমার বহন করবেন।','পণ্য ফেরত পেয়ে যাচাইয়ের পর ৩-৫ কার্যদিবসের মধ্যে বদল বা টাকা ফেরত দেওয়া হবে।'];
$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)closeOv()"><div class="pan md"><h2>↩️ ${en?'Return Policy':'রিটার্ন পলিসি'}</h2><ol style="padding-left:20px;line-height:1.7">${P1.map(x=>`<li>${x}</li>`).join('')}</ol><button class="btn w" onclick="closeOv()">${en?'Close':'বন্ধ করুন'}</button></div></div>`}
function logout(){if(au)au.signOut();sess=null;adm=false;user=null;W('bs',null);W('bu',null);S.v='home';render()}
